<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID BASICS</title>
    <style>
        .grid-containerOne{
            height: 500px;
            width:900px;
            border: 2px solid red;
            display: grid;
            grid-template-rows: repeat(4,1fr);
            grid-template-columns: repeat(4,1fr);
        }
        .item1{
            background-color: aqua;
            grid-row: 1/2;
            grid-column: 1/3;
        }
        .item2{
            background-color: lightcoral;
            grid-row: 1/3;
            grid-column: 3/5;
        }
        .item3{
            background-color: lightgreen;
            grid-row: 2/3;
            grid-column: 1/2;
        }
        .item4{
            background-color: lightyellow;
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .item5{
            background-color: rgb(24, 129, 164);
            grid-row: 3/4;
            grid-column: 1/5;
        }
    </style>
</head>
<body>
    <div class="grid-containerOne">
        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
    </div>
</body>
</html>
