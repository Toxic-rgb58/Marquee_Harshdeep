<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID GEO</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 250px 1fr 200px;
            grid-template-rows: 80px 1fr 60px;
            min-height: 100vh;
            gap: 15px;
            grid-template-areas: 
                "kshmr kshmr kshmr"
                "gujrat mp    assam"
                "kk     kk    kk";
        }

        .kshmr {
            grid-area: kshmr;
            background-color: #2c3e50;
            color: white;
        }

        .gujrat {
            grid-area: gujrat;
            background-color: #ecf0f1;
        }

        .mp {
            grid-area: mp;
            background-color: #e0e0e0;
        }

        .assam {
            grid-area: assam;
            background-color: #d1e8e2;
        }

        .kk {
            grid-area: kk;
            background-color: #34495e;
            color: white;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="kshmr">KASHMIR</div>
        <div class="gujrat">GUJARAT</div>
        <div class="mp">MADHYA PRADESH</div>
        <div class="assam">ASSAM</div>
        <div class="kk">KANYAKUMARI</div>
    </div>
</body>
</html>
