    <style>
        html {
        font-size: 16px;
    }

    .parent {
        font-size: 20px;
    }

    .child-em {
    font-size: 2em;   /* 40px because 2 × parent font size (20px) */
    margin: 1em;      /* 20px because based on the current font size */
    }

    .child-rem {
    font-size: 2rem;  /* 32px because 2 × root font size (16px) */
    margin: 1rem;     /* 16px because based on html font size */
}
    </style>
