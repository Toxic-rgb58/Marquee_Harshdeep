<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Properties</title>
    <style>
        p {
            font-size: 30px;
            margin: 10px;
            padding: 10px;
            display: inline;
        }
        span {
            font-size: 30px;
            margin: 10px;
            padding: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <p>lorem ipsum dolor sit amet</p>
    <span>lorem ipsum dolor sit amet</span>
</body>
</html>
