<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CART</title>
    <style>
        .card {
            width: 300px;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
        }
        .box {
            width: 80px;
            height: 40px;
            color: white;
            text-align: center;
            line-height: 40px;
            font-weight: bold;
            border-radius: 10px;
            display: inline-block;
        }
        .right-box {
            background-color: #bd0e0e;
        }
        .left-box {
            background-color: #bd0e0e;
            float: right;
        }
        div img {
            width: 100%;
            height: auto;
            margin-top: 20px;
        }
        .button {
            background-color: #4b4848;
            display: block;
            margin-top: 10px;
        }
        div .box-price {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="box right-box">Sale</div>
        <div class="box left-box">Liked</div>
        <div>
            <img src="https://images.unsplash.com/photo-1503602642458-232111445657?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c2hvZXN8ZW58MHx8MHx8fDA%3D&auto=format&fit=crop&w=500&q=60" alt="Shoe Image">    
        </div>
        <div class="box-price">Price: $100</div>
        <div class="box button">Buy Now</div>
    </div>
</body>
</html>
