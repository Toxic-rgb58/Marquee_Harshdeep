<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to right, red, blue);
        }
        .profile-card{
            width: 300px;
            height: 400px;
            border: 2px solid black;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            background-color: rgb(130, 127, 127);
        }
        .circle{
            height: 150px;
            width: 150px;
            border-radius: 50%;
            background-color: rgb(240, 170, 170);

        }
        div button{
            height: 40px;
            width: 80px;
            border-radius: 20%;
            background-color: rgb(42, 199, 199);
        }

        div img{
            height: 150px;
            width: 150px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1>Profile</h1>
        <div class ="circle">
            <img src="https://i.pinimg.com/736x/af/95/78/af95781204fac7608f4bf76dfc0d075c.jpg" alt="profile">
        </div>
        <p>Himanshu Goswami</p>
        <p>Web Developer</p>
        <button><a href="https://www.linkedin.com/in/himanshu-goswami-b88085350/" target="_blank">Follow</a></button>
    </div>
</body>
</html>
