<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVBAR</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0px;
            margin: 0px;
        }
        header{
            width: 100%;
            position: fixed;
            z-index: 1000;
        }
        nav{
            background-color: rgb(24, 22, 22);
            color: white;
        }
        nav ul{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
        }
        nav ul li{
            list-style-type: none;
            padding: 20px;
        }
        nav ul li a{
            text-decoration: none;
            color: white;
        }
        main{
            display: block;
        }
        .hero-section{
            width: 100%;
            height: 500px;
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: aqua;
        }
        .lower-section{
            height: 500px;
            width: 100%;
            background-color: rgb(89, 145, 205);
        }
        .chatbot-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 65px;
            height: 65px;
            border: none;
            background: none;
            padding: 0;
            cursor: pointer;
            z-index: 9999;
        }
        .chatbot-icon {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="">HOME</a></li>
                <li><a href="">BLOG</a></li>
                <li><a href="">PRODUCTS</a></li>
                <li><a href="">SERVICES</a></li>
                <li><a href="">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero-section">
            <h2>WELCOME TO THE WEBSITE</h2>
            <p>These are discription</p>
        </section>
        <section class="lower-section">
        </section>
    </main>
    <footer>
        <button class="chatbot-button" aria-label="Open chat">
            <img src="../../assets/images/chat boat.jpg" alt="Chat bot icon" class="chatbot-icon">
        </button>
    </footer>
</body>
</html>
