<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apna Bank</title>
</head>
<body>

    <h2>Apna Bank</h2>

    <!-- Create Account -->
    <form id="accountForm">
        <input type="text" placeholder="Customer Name" id="customerName">
        <input type="number" placeholder="Initial Balance" id="balance">
        <button>Create Account</button>
    </form>

    <br>

    <!-- Deposit -->
    <form id="depositForm">
        <input type="number" placeholder="Account Number" id="accNum">
        <input type="number" placeholder="Amount" id="amnt">
        <button>Deposit</button>
    </form>

    <br>

    <!-- Withdraw -->
    <form id="withdrawForm">
        <input type="number" placeholder="Account Number" id="withdrawAccNum">
        <input type="number" placeholder="Amount" id="withdrawAmnt">
        <button>Withdraw</button>
    </form>

    <script src="constructor.js"></script>

</body>
</html>
