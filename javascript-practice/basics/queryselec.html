<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <button class="detailsBtn">
        Card
        </button>
    </div>

    <div class="card">
        <h2>Samsung S25</h2>
        <p class="price">$799</p>
        <p class="rating">⭐⭐⭐⭐⭐</p>
        <button class="detailsBtn">
        Show details
        </button>
    </div>

    <script>
    const detailButton = document.querySelectorAll(".detailsBtn")

    for(let btn of detailButton){
        btn.addEventListener("click",function(){
        const card = this.closest(".card")
        const title = card.querySelector("h2")
        const price = card.querySelector(".price")
        const rating = card.querySelector(".rating")

        alert(
            title.innerText + "\n" +
            price.innerText + "\n" +
            rating.innerText
        )
        })
    }
    </script>
</body>
</html>
