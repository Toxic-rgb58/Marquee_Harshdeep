<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Clone</title>
  <link rel="stylesheet" href="flipkart.css">
</head>
<body>
  <!-- HEADER SECTION -->
   <header class = "header">
    <div class = "top">
      <div class = "logo">Flipkart</div>
      <div class = "travel">Travel</div>
      <div class = "location">Vadodra</div>
    </div>

    <div class = "middle">
      <input type="text" placeholder="Search for products, brands and more" class = "search">

      <span class = "login">Login</span>
      <span class = "more">More</span>
      <span class = "cart">Cart</span>
    </div>
    <div class = "bottom">
      <div class="box">For You</div>
      <div class="box">Electronics</div>
      <div class="box">Fashion</div>
      <div class="box">Home</div>
      <div class="box">Beauty</div>
      <div class="box">Sports</div>
      <div class="box">Mobiles</div>
      <div class="box">Grocery</div>
      <div class="box">Books</div>
      <div class="box">Toys</div>
      <div class="box">Automotive</div>
      <div class="box">Industrial</div>
      <div class="box">2 Wheelers</div>

    </div>
   </header>
   <!-- HERO SECTION -->
    <section id="hero">
      <div class="image">
        <img src="https://rukminim2.flixcart.com/fk-p-flap/3200/1560/image/728445c4b0dbe487.jpg?q=60" alt="img1">
        <img src="https://rukminim1.flixcart.com/fk-p-flap/3200/1560/image/bc1d2e428058ab48.png?q=60" alt="img2">
        <img src="https://rukminim1.flixcart.com/fk-p-flap/3200/1560/image/1a29c6dac2929c8a.png?q=60" alt="img3">
      </div>
    </section>
    <!-- RECOMMENDATION SECTION -->
     <section id="recommendation">
      <div class="container">
        <img src="" alt="">
        <img src="" alt="">
        <img src="" alt="">
      </div>
      </section>
      <!-- FOOTER -->
       <footer class="footer">
        <div class="description">
        <h2>Flipkart</h2>
        <p>Best place to buy</p>
      </div><div class="about">
        <h2>About Us</h2>
        <p>About us</p>
        <p>Careers</p>
      </div><div class="help">
        <h2>Help</h2>
        <p>Contact us at support@flipkart.com</p>
    </div>
</footer>
</body>
</html>
