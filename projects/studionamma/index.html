<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Namma | Branding, Designing & Webflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="right">
      <div class="logo">
        <span>STUDIO</span>
        <span>NAMMA</span>
      </div>

      <div class="mode">
        <span>DARK</span>
        <span>MODE</span>
      </div>
    </div>
    <div class="left">
      <div class="menu">
        <span>MENU</span>
      </div>

      <div class="connect">
        <span>LET'S TALK</span>
      </div>
    </div>
  </nav>

  <section class="hero">
    <p>WE THINK</p>
    <p>CRAFT AND</p>
    <p>DESIGN</p>
  </section>

  <section class="video-embed">
    <iframe src="https://player.vimeo.com/video/1127104834?h=4484a3c2f1&autoplay=1&muted=1&loop=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Studio Namma Video"></iframe>
  </section>

  <section class="hero-copy">
    <div class="home_intro_mono_wrapper simple-appear hide-mobile-landscape">
      <h2 class="text-mono">Creative studio building premium Brands</h2>
    </div>
    <div class="padding-global">
      <div class="container-large">
        <div class="home_intro_component">
          <div class="simple-appear hide-mobile-landscape">
            <p class="home_intro_content">It’s never “just a website.” Every <span class="home_intro_hover is-first">detail<span class="hover-popup"><img src="https://via.placeholder.com/320x220?text=Detail+Preview" alt="Detail preview"></span></span> matters.<br>We craft digital experiences.<br>Your design. Our obsession.<br>Your brand. Our <span class="home_intro_hover is-second">playground<span class="hover-popup"><img src="https://via.placeholder.com/320x220?text=Playground+Preview" alt="Playground preview"></span></span>.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="cursor-box">
  <video autoplay muted loop playsinline>
    <source src="https://cdn.prod.website-files.com/679cb9cacf00799ba4b4c985/68dfa5030619737bde7460e5_Home-Hero-DK%20ModeV4-transcode.mp4" type="video/mp4">
  </video>
</div>
  <script src="script.js"></script>
</body>
</html>
