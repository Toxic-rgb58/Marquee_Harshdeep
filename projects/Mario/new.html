<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Mario Game</title>
    <link rel="stylesheet" href="./new.css" />
</head>
<body>
    <div class="game">
        <div class="world">
            <div class="clouds">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
            </div>
            <div class="brick b1">
                <span class="question">?</span>
            </div>
            <div class="brick b2">
                <span class="question">?</span>
            </div>
            <div class="brick b3">
                <span class="question">?</span>
            </div>
            <img class="pipe-img" src="./images.png" alt="pipe">
            <img class="mushroom-img" src="./fe48b319473e9be46b950201823769ba.jpg" alt="mushroom">
            <img class="player-img" src="./artworks-000470883435-4ystus-t1080x1080.jpg" alt="mario player">
            <div class="ground"></div>
        </div>
    </div>
    <script src="./new.js"></script>
</body>
</html>
