<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOARD</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #1e1e1e;
            color:white;
        }
        .controls{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
            background-color: coral;
            color: whitesmoke;
            border: none;
            transition: background-color 0.3s;
        }
        button:hover{
            background-color: #33c755;
        }
        canvas{
            border: 2px solid white;
            cursor: crosshair;
            background-color: #52bad1;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: background-color 0.3s;
            
        }

    </style>
</head>
<body>
    <div class="controls">
        <button id="clearBtn">Clear</button>
        <p>Double click to change background color || right click to change brush color</p>

    </div>
    <canvas id="board" width="800" height="600"></canvas>
    <script src="script.js"></script>
</body>
</html>
