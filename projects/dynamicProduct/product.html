<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Cards</title>
<style>
body{
    font-family:Arial;
    background:#f2f2f2;
    text-align:center;
}
h1{
    margin-top:20px;
}
button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
    cursor:pointer;
    background:royalblue;
    color:white;
    border:none;
    border-radius:5px;
}
#products{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:30px;
}
.card{
    width:250px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px gray;
    padding:15px;
}
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:10px;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>
<h1>Product Categories</h1>
<button onclick="showProducts('phones')">Phones</button>
<button onclick="showProducts('laptops')">Laptops</button>
<button onclick="showProducts('headphones')">Headphones</button>
<button onclick="showProducts('watches')">Smart Watches</button>
<div id="products"></div>
<script src="product.js"></script>
</body>
</html>
